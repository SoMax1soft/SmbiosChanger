name: Build SmbiosSpoofer EFI

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout spoofer repo
        uses: actions/checkout@v4
        with:
          path: SmbiosChanger

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential uuid-dev iasl git nasm python3 python3-distutils-extra

      - name: Checkout EDK2
        uses: actions/checkout@v4
        with:
          repository: tianocore/edk2
          ref: edk2-stable202405
          submodules: recursive
          path: edk2

      - name: Build EDK2 BaseTools
        working-directory: edk2
        run: |
          make -C BaseTools

      - name: Stage spoofer inside EDK2
        run: |
          cp -r SmbiosChanger edk2/SmbiosSpoofer

      - name: Build SmbiosSpoofer.efi
        working-directory: edk2
        run: |
          set -e
          export WORKSPACE=$PWD
          export EDK_TOOLS_PATH=$PWD/BaseTools
          . edksetup.sh BaseTools
          build -a X64 -b RELEASE -t GCC5 -p SmbiosSpoofer/SmbiosSpooferV2.dsc

      - name: Collect artifact
        run: |
          mkdir -p out
          find edk2/Build -name 'SmbiosSpooferV2.efi' -exec cp {} out/ \;
          ls -la out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmbiosSpooferV3-fixed
          path: out/SmbiosSpooferV2.efi
          if-no-files-found: error
