name: Build SmbiosSpoofer EFI

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout spoofer repo
        uses: actions/checkout@v4
        with:
          path: SmbiosChanger

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential uuid-dev iasl git nasm python3 python-is-python3

      - name: Clone EDK2 and init submodules (skip dead subhook)
        run: |
          set -e
          git clone --depth 1 --branch edk2-stable202611 https://github.com/tianocore/edk2.git
          cd edk2
          git config -f .gitmodules --remove-section submodule.UnitTestFrameworkPkg/Library/SubhookLib/subhook || true
          sed -i '/SubhookLib\/subhook/d' .gitmodules || true
          git submodule update --init --depth 1 --recursive --jobs 4 || {
            echo "Recursive init failed; falling back to per-submodule init."
            for p in $(git config -f .gitmodules --get-regexp '^submodule\..*\.path$' | awk '{print $2}'); do
              case "$p" in
                *SubhookLib*) echo "Skipping $p"; continue ;;
              esac
              git submodule update --init --depth 1 "$p" || echo "Failed $p, continuing"
            done
          }

      - name: Build EDK2 BaseTools
        working-directory: edk2
        run: |
          make -C BaseTools

      - name: Stage spoofer inside EDK2
        run: |
          cp -r SmbiosChanger edk2/SmbiosChanger-main

      - name: Build SmbiosSpoofer.efi
        working-directory: edk2
        run: |
          set -e
          export WORKSPACE=$PWD
          export EDK_TOOLS_PATH=$PWD/BaseTools
          . edksetup.sh BaseTools
          build -a X64 -b RELEASE -t GCC -p SmbiosChanger-main/SmbiosSpooferV2.dsc

      - name: Collect artifact
        run: |
          mkdir -p out
          find edk2/Build -name 'SmbiosSpooferV2.efi' -exec cp {} out/ \;
          ls -la out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmbiosSpooferV3-fixed
          path: out/SmbiosSpooferV2.efi
          if-no-files-found: error
